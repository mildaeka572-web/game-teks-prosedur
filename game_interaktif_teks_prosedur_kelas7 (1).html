<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misi Teks Prosedur — Kelas VII</title>
<style>
:root{--navy:#193746;--teal:#218c98;--mint:#e9f6f3;--gold:#f2b84b;--paper:#fbfaf5;--ink:#263943;--green:#237a55;--red:#b54747}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf5f3,#fbfaf5);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:850px;margin:24px auto;padding:16px}.top{background:var(--navy);color:white;border-radius:22px;padding:24px 28px;box-shadow:0 8px 25px #19374622}.tag{color:#a5e1dc;font-weight:800;letter-spacing:.08em;font-size:.82rem}.top h1{margin:.35rem 0;font-size:clamp(1.7rem,5vw,2.5rem)}.top p{margin:.4rem 0 0;color:#e0eeee}.panel{background:white;margin-top:18px;padding:24px;border-radius:20px;box-shadow:0 6px 20px #19374614}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.progress{height:12px;background:#e4eeee;border-radius:99px;overflow:hidden;flex:1;min-width:180px}.bar{height:100%;width:0;background:var(--teal);transition:width .3s}.pill{background:var(--mint);padding:7px 12px;border-radius:99px;font-weight:800;color:var(--navy)}h2{color:var(--navy);margin:12px 0 8px}.question{font-size:1.25rem;font-weight:750;margin:20px 0}.options{display:grid;gap:10px}.opt,button{font:inherit}.opt{padding:13px 16px;border:2px solid #dce8e7;border-radius:14px;background:white;text-align:left;cursor:pointer;transition:.15s}.opt:hover{border-color:var(--teal);background:#f4fbfa}.opt:disabled{cursor:default}.opt.correct{border-color:var(--green);background:#e9f7ef}.opt.wrong{border-color:var(--red);background:#fff0ee}.feedback{min-height:30px;margin:13px 0;font-weight:700}.btn{border:0;border-radius:12px;padding:11px 19px;background:var(--teal);color:white;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#e8f0ef;color:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}.note{font-size:.92rem;color:#53656b}.sentence{background:var(--paper);border-left:5px solid var(--gold);padding:14px;border-radius:10px;margin:12px 0}.word{display:inline-block;background:#f2f7f6;border:1px solid #d9e7e5;padding:3px 8px;border-radius:8px;margin:3px}.orderlist{display:grid;gap:9px}.step{background:#f4f8f7;padding:10px 12px;border-radius:12px;display:flex;align-items:center;gap:10px}.step span{flex:1}.step button{border:0;border-radius:8px;padding:7px 10px;background:#dfeeed;cursor:pointer;font-weight:900;color:var(--navy)}.hidden{display:none}.result{font-size:1.1rem}.big{font-size:2.7rem;color:var(--teal);font-weight:900}.footer{text-align:center;font-size:.85rem;color:#607277;padding:15px}@media(max-width:560px){.wrap{padding:10px;margin:10px auto}.panel{padding:17px}.top{padding:20px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="tag">BAHASA INDONESIA • KELAS VII</div><h1>🎯 Misi Teks Prosedur</h1><p>Jadilah detektif bahasa! Kenali ciri-ciri teks prosedur dan susun langkahnya dengan tepat.</p></header>
<section class="panel" id="game">
<div class="row"><div class="progress"><div class="bar" id="bar"></div></div><span class="pill" id="round">Misi 1 / 8</span><span class="pill" id="score">Skor: 0</span></div>
<div id="content"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn" id="next" disabled>Lanjut →</button></div>
</section>
<section class="panel hidden" id="finish"></section><div class="footer">Baca cermat • Pilih jawaban • Belajar sambil bermain</div></main>
<script>
const missions=[
{type:'choice',q:'Apa tujuan utama teks prosedur?',opts:['Menceritakan pengalaman lucu','Menjelaskan cara melakukan atau membuat sesuatu','Menggambarkan suasana suatu tempat','Menyampaikan pendapat tentang tokoh'],ans:1,why:'Teks prosedur memberi petunjuk melalui langkah-langkah.'},
{type:'choice',q:'Manakah kalimat perintah?',opts:['Teh itu terasa manis.','Gelas berada di atas meja.','Masukkan gula ke dalam gelas.','Ibu membuat teh setiap pagi.'],ans:2,why:'Kalimat tersebut meminta pembaca melakukan tindakan.'},
{type:'choice',q:'Kata kerja tindakan yang tepat untuk langkah prosedur adalah …',opts:['indah','kemudian','aduk','karena'],ans:2,why:'“Aduk” menyatakan tindakan yang dilakukan.'},
{type:'choice',q:'Kata yang menunjukkan urutan langkah adalah …',opts:['perlahan','kemudian','bersih','sedikit'],ans:1,why:'“Kemudian” membantu menunjukkan langkah berikutnya.'},
{type:'choice',q:'Pada kalimat “Aduk perlahan selama satu menit”, kata “perlahan” menerangkan …',opts:['cara','jumlah','urutan','bahan'],ans:0,why:'“Perlahan” menjelaskan bagaimana tindakan mengaduk dilakukan.'},
{type:'choice',q:'Apa arti kata “hingga” pada kalimat “Aduk hingga gula larut”?',opts:['Menunjukkan bahan','Menandai hasil yang harus dicapai','Menunjukkan larangan','Mengurutkan bahan'],ans:1,why:'Langkah mengaduk dilakukan sampai hasilnya tercapai, yaitu gula larut.'},
{type:'identify',q:'Detektif kata! Pilih kata penghubung urutan pada kalimat berikut.',sentence:'Pertama, cuci mangga. Kemudian, kupas kulitnya.',opts:['mangga','kemudian','kulitnya','cuci'],ans:1,why:'“Kemudian” menunjukkan urutan langkah.'},
{type:'order',q:'Susun langkah membuat teh manis. Gunakan tombol ↑ dan ↓.',steps:['Aduk hingga gula larut.','Siapkan gelas, teh, gula, dan air panas.','Tuangkan air panas ke dalam gelas.','Masukkan teh dan gula ke dalam gelas.'],correct:['Siapkan gelas, teh, gula, dan air panas.','Masukkan teh dan gula ke dalam gelas.','Tuangkan air panas ke dalam gelas.','Aduk hingga gula larut.'],why:'Mulai dengan menyiapkan bahan, masukkan bahan, tuang air, lalu aduk.'}
];
let idx=0,score=0,locked=false;const content=document.getElementById('content'),feedback=document.getElementById('feedback'),next=document.getElementById('next');
function render(){locked=false;feedback.textContent='';next.disabled=true;let m=missions[idx];document.getElementById('round').textContent=`Misi ${idx+1} / ${missions.length}`;document.getElementById('score').textContent=`Skor: ${score}`;document.getElementById('bar').style.width=`${idx/missions.length*100}%`;
content.innerHTML=`<h2>${m.type==='order'?'🧩 Susun langkah':m.type==='identify'?'🔎 Temukan cirinya':'🧠 Pilih jawaban'}</h2><div class="question">${m.q}</div>`;
if(m.sentence)content.innerHTML+=`<div class="sentence">${m.sentence}</div>`;
if(m.type==='choice'||m.type==='identify'){let div=document.createElement('div');div.className='options';m.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>answer(i,b);div.appendChild(b)});content.appendChild(div)}
if(m.type==='order'){let wrap=document.createElement('div');wrap.className='orderlist';let state=[...m.steps];function draw(){wrap.innerHTML='';state.forEach((s,i)=>{let row=document.createElement('div');row.className='step';let t=document.createElement('span');t.textContent=`${i+1}. ${s}`;row.appendChild(t);for(let [sym,delta] of [['↑',-1],['↓',1]]){let b=document.createElement('button');b.textContent=sym;b.setAttribute('aria-label',sym==='↑'?'Pindahkan ke atas':'Pindahkan ke bawah');b.disabled=(delta<0&&i===0)||(delta>0&&i===state.length-1);b.onclick=()=>{[state[i],state[i+delta]]=[state[i+delta],state[i]];draw()};row.appendChild(b)}wrap.appendChild(row)});let check=document.createElement('button');check.className='btn';check.textContent='Periksa urutan';check.style.marginTop='12px';check.onclick=()=>{if(locked)return;locked=true;let ok=state.every((s,i)=>s===m.correct[i]);feedback.textContent=(ok?'✅ Tepat! ':'💡 Belum tepat. ')+m.why;feedback.style.color=ok?'var(--green)':'var(--red)';if(ok)score+=15;document.getElementById('score').textContent=`Skor: ${score}`;next.disabled=false;wrap.querySelectorAll('button').forEach(x=>x.disabled=true)};wrap.appendChild(check)}draw();content.appendChild(wrap)} }
function answer(i,b){if(locked)return;locked=true;let m=missions[idx],ok=i===m.ans;b.classList.add(ok?'correct':'wrong');document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===m.ans)x.classList.add('correct')});feedback.textContent=(ok?'✅ Benar! ':'💡 Coba ingat lagi. ')+m.why;feedback.style.color=ok?'var(--green)':'var(--red)';if(ok)score+=10;document.getElementById('score').textContent=`Skor: ${score}`;next.disabled=false}
next.onclick=()=>{idx++;if(idx<missions.length)render();else finish()};
function finish(){document.getElementById('game').classList.add('hidden');let f=document.getElementById('finish');f.classList.remove('hidden');document.getElementById('bar').style.width='100%';let msg=score>=65?'Hebat, kamu sudah jadi detektif prosedur!':score>=40?'Bagus! Coba ulangi misi yang masih membingungkan.':'Terus berlatih—setiap langkah membantu kamu makin paham!';f.innerHTML=`<div class="tag">MISI SELESAI</div><div class="big">${score} poin</div><h2>${msg}</h2><p class="result">Kamu telah berlatih mengenali tujuan teks, kalimat perintah, kata kerja tindakan, penanda urutan, keterangan, serta menyusun langkah secara runtut.</p><button class="btn" onclick="location.reload()">Main lagi ↻</button>`}
render();
</script></body></html>
